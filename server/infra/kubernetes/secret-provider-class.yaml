# Mounts Key Vault secrets into the pod. The workload identity is the one in the permission matrix.
# clientID is substituted from the Bicep output workloadIdentityClientIds at deploy time.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: ledgerflow-secrets
  namespace: ledgerflow
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: "${WORKLOAD_CLIENT_ID}"
    keyvaultName: "${KEY_VAULT_NAME}"
    tenantId: "${AZURE_TENANT_ID}"
    objects: |
      array:
        - |
          objectName: postgres-connection-string
          objectType: secret

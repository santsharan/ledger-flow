# Default deny inside the ledgerflow namespace, then the paths the architecture actually uses.
# Traffic from another pod is not trusted merely because it is in the cluster (ADR-012).
apiVersion: v1
kind: Namespace
metadata:
  name: ledgerflow
  labels:
    name: ledgerflow
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: ledgerflow
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: ledgerflow
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-ingress
  namespace: ledgerflow
spec:
  podSelector:
    matchLabels:
      app: api-gateway
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 3000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-to-services
  namespace: ledgerflow
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - identity-service
          - merchant-service
          - payment-service
          - ledger-service
          - settlement-service
          - reconciliation-service
          - risk-service
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api-gateway
      ports:
        - protocol: TCP
          port: 3000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: payment-downstream
  namespace: ledgerflow
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - ledger-service
          - risk-service
          - merchant-service
          - acquirer-simulator
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: payment-service
      ports:
        - protocol: TCP
          port: 3000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-azure-egress
  namespace: ledgerflow
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    # Private endpoint subnet 10.20.16.0/24. Data services have no public endpoint.
    - to:
        - ipBlock:
            cidr: 10.20.16.0/24
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 10000
        - protocol: TCP
          port: 443

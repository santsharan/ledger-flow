apiVersion: v1
kind: ServiceAccount
metadata:
  name: ledger-service
  namespace: ledgerflow
  annotations:
    azure.workload.identity/client-id: ${WORKLOAD_CLIENT_ID_LEDGER_SERVICE}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger-service
  namespace: ledgerflow
  labels:
    app: ledger-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ledger-service
  template:
    metadata:
      labels:
        app: ledger-service
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: ledger-service
      terminationGracePeriodSeconds: 30
      containers:
        - name: ledger-service
          image: ${ACR_LOGIN_SERVER}/ledgerflow/ledger-service:${IMAGE_TAG}
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: SERVICE_NAME
              value: ledger-service
            - name: PORT
              value: "3000"
            - name: LEDGERFLOW_ENV
              value: ${LEDGERFLOW_ENV}
            - name: OTEL_ENABLED
              value: "true"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.ledgerflow.svc:4317
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 15
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ledger-service
  namespace: ledgerflow
spec:
  selector:
    app: ledger-service
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ledger-service
  namespace: ledgerflow
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: ledger-service
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ledger-service
  namespace: ledgerflow
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ledger-service
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

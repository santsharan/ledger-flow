apiVersion: v1
kind: ServiceAccount
metadata:
  name: acquirer-simulator
  namespace: ledgerflow
  annotations:
    azure.workload.identity/client-id: ${WORKLOAD_CLIENT_ID_ACQUIRER_SIMULATOR}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: acquirer-simulator
  namespace: ledgerflow
  labels:
    app: acquirer-simulator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: acquirer-simulator
  template:
    metadata:
      labels:
        app: acquirer-simulator
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: acquirer-simulator
      terminationGracePeriodSeconds: 30
      containers:
        - name: acquirer-simulator
          image: ${ACR_LOGIN_SERVER}/ledgerflow/acquirer-simulator:${IMAGE_TAG}
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: SERVICE_NAME
              value: acquirer-simulator
            - name: PORT
              value: "3000"
            - name: LEDGERFLOW_ENV
              value: ${LEDGERFLOW_ENV}
            - name: OTEL_ENABLED
              value: "true"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.ledgerflow.svc:4317
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 15
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: acquirer-simulator
  namespace: ledgerflow
spec:
  selector:
    app: acquirer-simulator
  ports:
    - name: http
      port: 80
      targetPort: http

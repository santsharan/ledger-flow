apiVersion: v1
kind: ServiceAccount
metadata:
  name: notification-service
  namespace: ledgerflow
  annotations:
    azure.workload.identity/client-id: ${WORKLOAD_CLIENT_ID_NOTIFICATION_SERVICE}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: ledgerflow
  labels:
    app: notification-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: notification-service
      terminationGracePeriodSeconds: 30
      containers:
        - name: notification-service
          image: ${ACR_LOGIN_SERVER}/ledgerflow/notification-service:${IMAGE_TAG}
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: SERVICE_NAME
              value: notification-service
            - name: PORT
              value: "3000"
            - name: LEDGERFLOW_ENV
              value: ${LEDGERFLOW_ENV}
            - name: OTEL_ENABLED
              value: "true"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.ledgerflow.svc:4317
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 15
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: ledgerflow
spec:
  selector:
    app: notification-service
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: notification-service
  namespace: ledgerflow
spec:
  scaleTargetRef:
    name: notification-service
  minReplicaCount: 1
  maxReplicaCount: 10
  cooldownPeriod: 120
  triggers:
    - type: azure-servicebus
      metadata:
        queueName: notification
        namespace: ${SERVICE_BUS_NAMESPACE}
        messageCount: "5"
      authenticationRef:
        name: workload-identity-auth

# Local development environment for LedgerFlow.
#
# Everything the platform needs runs here: PostgreSQL is the financial source of truth,
# Kafka stands in for Service Bus and Event Hubs (ADR-008), and the observability stack
# mirrors what Azure Monitor provides in the cloud.
#
#   make infra-up      start and wait for health
#   make infra-down    stop, keep data
#   make reset         destroy data and start clean

name: ledgerflow

services:
  postgres:
    image: postgres:17-alpine
    container_name: ledgerflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ledgerflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ledgerflow_local_password}
      POSTGRES_DB: postgres
      # Deterministic collation and UTC keep test results identical across machines.
      POSTGRES_INITDB_ARGS: '--locale=C --encoding=UTF8'
      TZ: UTC
      PGTZ: UTC
    command:
      - postgres
      - '-c'
      - 'max_connections=300'
      - '-c'
      - 'log_lock_waits=on'
      - '-c'
      - 'deadlock_timeout=500ms'
      - '-c'
      - 'log_min_duration_statement=500'
      - '-c'
      - 'track_io_timing=on'
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-ledgerflow} -d postgres']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: ledgerflow-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.9.0
    container_name: ledgerflow-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_RETENTION_HOURS: 168
      CLUSTER_ID: ledgerflow-local-cluster
    ports:
      - '${KAFKA_PORT:-29092}:29092'
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        ['CMD-SHELL', '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092']
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: ledgerflow-kafka-ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: ledgerflow-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: 'true'
    ports:
      - '${KAFKA_UI_PORT:-8080}:8080'

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.1
    container_name: ledgerflow-otel-collector
    restart: unless-stopped
    command: ['--config=/etc/otel/config.yaml']
    depends_on:
      - jaeger
      - loki
    volumes:
      - ./otel/collector-config.yaml:/etc/otel/config.yaml:ro
    ports:
      - '${OTLP_GRPC_PORT:-4317}:4317' # OTLP gRPC — services export here
      - '${OTLP_HTTP_PORT:-4318}:4318' # OTLP HTTP
      - '8889:8889' # Prometheus scrape endpoint for collected metrics
      - '13133:13133' # health_check extension

  jaeger:
    image: jaegertracing/all-in-one:1.65.0
    container_name: ledgerflow-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
      SPAN_STORAGE_TYPE: memory
    ports:
      - '${JAEGER_UI_PORT:-16686}:16686'

  loki:
    image: grafana/loki:3.3.2
    container_name: ledgerflow-loki
    restart: unless-stopped
    command: ['-config.file=/etc/loki/config.yaml']
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    ports:
      - '${LOKI_PORT:-3101}:3100'

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: ledgerflow-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=72h'
      - '--web.enable-lifecycle'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - '${PROMETHEUS_PORT:-9090}:9090'

  grafana:
    image: grafana/grafana:11.4.0
    container_name: ledgerflow-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
      - loki
      - jaeger
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - '${GRAFANA_PORT:-3100}:3000'

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  prometheus-data:
  grafana-data:
  loki-data:

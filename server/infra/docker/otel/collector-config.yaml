# Services export OTLP to this collector, which fans out to Jaeger (traces),
# Prometheus (metrics) and Loki (logs). In Azure the same OTLP export targets
# Application Insights instead, so application code never changes.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 1024
  memory_limiter:
    check_interval: 5s
    limit_percentage: 80
    spike_limit_percentage: 20
  resource:
    attributes:
      - key: deployment.environment
        value: local
        action: upsert
  # Defence in depth against a service accidentally attaching sensitive attributes
  # (specification §48): drop them at the collector as well as at the source.
  attributes/redact:
    actions:
      - key: http.request.header.authorization
        action: delete
      - key: card.number
        action: delete
      - key: cvv
        action: delete
      - key: password
        action: delete

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
  debug:
    verbosity: basic

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/redact, resource, batch]
      exporters: [otlp/jaeger]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, attributes/redact, resource, batch]
      exporters: [otlphttp/loki]
  telemetry:
    logs:
      level: warn

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: local
    platform: ledgerflow

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # Application metrics arrive over OTLP and are re-exposed by the collector.
  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8889']

  # Services running on the host during development (pnpm start), not in a container.
  - job_name: ledgerflow-services
    metrics_path: /metrics
    static_configs:
      - targets:
          - 'host.docker.internal:3000'
          - 'host.docker.internal:3001'
          - 'host.docker.internal:3002'
          - 'host.docker.internal:3003'
          - 'host.docker.internal:3004'
          - 'host.docker.internal:3005'
          - 'host.docker.internal:3006'
          - 'host.docker.internal:3007'
          - 'host.docker.internal:3008'
          - 'host.docker.internal:3009'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
